name: Update README Stats

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours - adjust as you like
  workflow_dispatch:          # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Update stats block
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
          # Set to "true" if cloning every repo for line counts is too slow
          SKIP_LOC: "false"
        run: python update_stats.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update GitHub stats [skip ci]"
          # Everything generated: both SVGs plus the stats.json they render
          # from. Pinning this to card.svg alone silently threw away the
          # stats panel and the saved numbers on every run.
          file_pattern: assets/card.svg assets/github-stats.svg assets/stats.json

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-label="SVG filter probe: pixelate (fallback), dither, combined+animated, control">
<defs>
  <!-- Cell 2: dither = feTurbulence -> discrete quantise -->
  <filter id="dither" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="matrix"
      values="0 0 0 0 0.34  0 0 0 0 0.60  0 0 0 0 0.18  0 0 0 1 0" result="tinted"/>
    <feComponentTransfer in="tinted" result="banded">
      <feFuncA type="discrete" tableValues="0 0.25 0.55 0.85 1"/>
    </feComponentTransfer>
  </filter>

  <!-- Cell 3: dither driving CSS-animated shape -->
  <filter id="combined" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" stitchTiles="stitch" result="noise"/>
    <feComponentTransfer in="noise" result="banded">
      <feFuncA type="discrete" tableValues="0 0.4 0.7 1"/>
    </feComponentTransfer>
    <feComposite in="banded" in2="SourceGraphic" operator="in"/>
  </filter>

  <style>
    @keyframes pulse { 0%,45% { opacity: 1 } 50%,95% { opacity: 0.35 } 100% { opacity: 1 } }
    .anim { animation: pulse 3s steps(1,end) infinite; }
    text { font: 12px ui-monospace, monospace; fill: #FAFCFD; }
    rect.bg { fill: #115566; }
  </style>
</defs>

<rect class="bg" width="960" height="260"/>

<!-- Cell 1: pixelation FAILED as a pure filter (no downsample primitive
     without a raster feImage - the exact Safari-fragile path this plan
     ruled out). Falls back to the precomputed Python rasterizer already
     designed for this piece; not re-tested here. -->
<g transform="translate(20,20)">
  <text y="-6">1. pixelate: FALLBACK (Python)</text>
  <rect x="0" y="0" width="200" height="200" fill="none" stroke="#1B693C" stroke-dasharray="4 4"/>
  <text x="20" y="110" fill="#9BC43C">no filter path -</text>
  <text x="20" y="128" fill="#9BC43C">precompute instead</text>
</g>

<!-- Cell 2: dither field -->
<g transform="translate(260,20)">
  <text y="-6">2. dither (feTurbulence+discrete)</text>
  <rect width="200" height="200" filter="url(#dither)"/>
  <rect width="200" height="200" fill="none" stroke="#1B693C"/>
</g>

<!-- Cell 3: dither-masked shape + animated -->
<g transform="translate(500,20)">
  <text y="-6">3. dither-masked + CSS animated</text>
  <circle class="anim" cx="100" cy="100" r="90" fill="#56992F" filter="url(#combined)"/>
</g>

<!-- Cell 4: control, no filter -->
<g transform="translate(740,20)">
  <text y="-6">4. control (no filter)</text>
  <circle cx="100" cy="100" r="90" fill="#56992F"/>
</g>
</svg>

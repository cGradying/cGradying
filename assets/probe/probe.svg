<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-label="SVG filter probe: pixelate, dither, combined+animated, control">
<defs>
  <!-- Cell 1: pixelate via feMorphology dilate (not feImage - Safari-fragile) -->
  <filter id="pixelate" x="-10%" y="-10%" width="120%" height="120%">
    <feMorphology operator="dilate" radius="3" in="SourceGraphic" result="dilated"/>
    <feFlood flood-color="#000" result="black"/>
    <feComposite in="black" in2="dilated" operator="in"/>
  </filter>

  <!-- Cell 2: dither = feTurbulence -> discrete quantise -->
  <filter id="dither" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="matrix"
      values="0 0 0 0 0.06  0 0 0 0 0.73  0 0 0 0 0.51  0 0 0 1 0" result="tinted"/>
    <feComponentTransfer in="tinted" result="banded">
      <feFuncA type="discrete" tableValues="0 0.25 0.55 0.85 1"/>
    </feComponentTransfer>
  </filter>

  <!-- Cell 3: both chains stacked on one shape -->
  <filter id="combined" x="-10%" y="-10%" width="120%" height="120%">
    <feMorphology operator="dilate" radius="3" in="SourceGraphic" result="dilated"/>
    <feFlood flood-color="#000" result="black"/>
    <feComposite in="black" in2="dilated" operator="in" result="pixelShape"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" stitchTiles="stitch" result="noise"/>
    <feComponentTransfer in="noise" result="banded">
      <feFuncA type="discrete" tableValues="0 0.4 0.7 1"/>
    </feComponentTransfer>
    <feComposite in="banded" in2="pixelShape" operator="in"/>
  </filter>

  <style>
    @keyframes pulse { 0%,45% { opacity: 1 } 50%,95% { opacity: 0.35 } 100% { opacity: 1 } }
    .anim { animation: pulse 3s steps(1,end) infinite; }
    text { font: 12px ui-monospace, monospace; fill: #e5e7eb; }
    rect.bg { fill: #0b1220; }
  </style>
</defs>

<rect class="bg" width="960" height="260"/>

<!-- Cell 1: pixelated AWS logo path -->
<g transform="translate(20,20)">
  <text y="-6">1. pixelate (feMorphology)</text>
  <g filter="url(#pixelate)" transform="scale(8)">
    <path fill="#f59e0b" d="M6.763 10.036c0 .296.032.535.088.71.064.176.144.368.256.576.04.063.056.127.056.183 0 .08-.048.16-.152.24l-.503.335a.383.383 0 0 1-.208.072c-.08 0-.16-.04-.239-.112a2.47 2.47 0 0 1-.287-.375 6.18 6.18 0 0 1-.248-.471c-.622.734-1.405 1.101-2.347 1.101-.67 0-1.205-.191-1.596-.574-.391-.384-.59-.894-.59-1.533 0-.678.239-1.23.726-1.644.487-.415 1.133-.623 1.955-.623.272 0 .551.024.846.064.296.04.6.104.918.176v-.583c0-.607-.127-1.03-.375-1.277-.255-.248-.686-.367-1.3-.367-.28 0-.568.031-.863.103-.295.072-.583.16-.862.272a2.287 2.287 0 0 1-.28.104.488.488 0 0 1-.127.023c-.112 0-.168-.08-.168-.247v-.391c0-.128.016-.224.056-.28a.597.597 0 0 1 .224-.167c.279-.144.614-.264 1.005-.36a4.84 4.84 0 0 1 1.246-.151c.95 0 1.644.216 2.091.647.439.43.662 1.085.662 1.963v2.586zm-3.24 1.214c.263 0 .534-.048.822-.144.287-.096.543-.271.758-.51.128-.152.224-.32.272-.512.047-.191.08-.423.08-.694v-.335a6.66 6.66 0 0 0-.735-.136 6.02 6.02 0 0 0-.75-.048c-.535 0-.926.104-1.19.32-.263.215-.39.518-.39.917 0 .375.095.655.295.846.191.2.47.296.838.296z"/>
  </g>
</g>

<!-- Cell 2: dither field -->
<g transform="translate(260,20)">
  <text y="-6">2. dither (feTurbulence+discrete)</text>
  <rect width="200" height="200" filter="url(#dither)"/>
  <rect width="200" height="200" fill="none" stroke="#374151"/>
</g>

<!-- Cell 3: combined + animated -->
<g transform="translate(500,20)">
  <text y="-6">3. combined + CSS animated</text>
  <circle class="anim" cx="100" cy="100" r="90" fill="#10b981" filter="url(#combined)"/>
</g>

<!-- Cell 4: control, no filter -->
<g transform="translate(740,20)">
  <text y="-6">4. control (no filter)</text>
  <circle cx="100" cy="100" r="90" fill="#10b981"/>
</g>
</svg>
